name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No credentials in CI: the build must not require a production secret.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm test

      - run: npx next build
        env:
          SKIP_ENV_VALIDATION: '1'
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
